# ==============================================
# PINKPATH RAILWAY CONFIGURATION
# ==============================================
# This file configures how Railway builds and deploys the backend
# Documentation: https://docs.railway.app/reference/config-as-code
# ==============================================

[build]
# Use the Dockerfile in the backend directory
# Build context is the repository root (needed for shared/ package)
dockerfilePath = "backend/Dockerfile"

[deploy]
# Number of instances (1 for beta, scale up later)
numReplicas = 1

# Health check configuration
healthcheckPath = "/health"
healthcheckTimeout = 30

# Restart policy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ==============================================
# NOTES FOR SETUP
# ==============================================
# After connecting your GitHub repo to Railway:
#
# 1. Add a PostgreSQL database from the Railway dashboard
#    - Click "New" -> "Database" -> "PostgreSQL"
#    - Railway will auto-set DATABASE_URL
#
# 2. Set these environment variables in Railway dashboard:
#    - FRONTEND_URL (your Netlify URL, e.g., https://pinkpath.netlify.app)
#    - JWT_SECRET (generate with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
#    - SESSION_SECRET (generate another random string)
#    - GOOGLE_MAPS_API_KEY (from Google Cloud Console)
#    - GOOGLE_CLIENT_ID (for OAuth)
#    - GOOGLE_CLIENT_SECRET (for OAuth)
#    - DATASF_APP_TOKEN (for crime data)
#
# 3. Railway auto-sets:
#    - DATABASE_URL (from PostgreSQL add-on)
#    - PORT (Railway assigns this)
#    - NODE_ENV=production (set this manually)
# ==============================================
