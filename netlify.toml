# ==============================================
# PINKPATH NETLIFY CONFIGURATION
# ==============================================
# This file configures how Netlify builds and serves the frontend
# Documentation: https://docs.netlify.com/configure-builds/file-based-configuration/
# ==============================================

[build]
  # Directory to publish (relative to repository root)
  publish = "frontend"

  # No build command needed - static files only
  # If you add a build step later (e.g., bundler), add it here
  # command = "npm run build"

# ==============================================
# REDIRECTS & REWRITES
# ==============================================

# SPA fallback - serve index.html for all routes (client-side routing)
# force = false means actual files (JS, CSS, images) are served directly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# ==============================================
# SECURITY HEADERS
# ==============================================

[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"

    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"

    # Enable XSS filter
    X-XSS-Protection = "1; mode=block"

    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Content Security Policy (adjust as needed for Google Maps)
    # Note: Google Maps requires specific CSP rules
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.googleapis.com https://*.gstatic.com https://*.google.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.render.com; frame-src 'self' https://accounts.google.com;"

# Cache static assets aggressively
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ==============================================
# ENVIRONMENT-SPECIFIC SETTINGS
# ==============================================

# Production context
[context.production]
  # Add production-specific settings here if needed

# Preview/branch deploy context
[context.deploy-preview]
  # Add preview-specific settings here if needed
