# ==============================================
# PINKPATH RENDER CONFIGURATION
# ==============================================
# Render Blueprint - Infrastructure as Code
# Documentation: https://docs.render.com/blueprint-spec
# ==============================================

services:
  # Backend API Service
  - type: web
    name: pinkpath-backend
    runtime: node
    region: oregon  # or ohio, frankfurt, singapore
    plan: free      # free tier for beta testing

    # Build configuration (monorepo - build from root)
    buildCommand: npm ci --omit=dev
    startCommand: node backend/src/server.js

    # Health check
    healthCheckPath: /health

    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000  # Render uses port 10000 by default
      - key: FRONTEND_URL
        sync: false   # Set manually after Netlify deploy
      - key: BACKEND_URL
        value: https://pinkpath-backend.onrender.com
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates secure value
      - key: SESSION_SECRET
        generateValue: true  # Render auto-generates secure value
      - key: GOOGLE_CLIENT_ID
        sync: false   # Set manually
      - key: GOOGLE_CLIENT_SECRET
        sync: false   # Set manually
      - key: GOOGLE_MAPS_API_KEY
        sync: false   # Set manually
      - key: DATASF_APP_TOKEN
        sync: false   # Set manually
      - key: DATABASE_URL
        fromDatabase:
          name: pinkpath-db
          property: connectionString

databases:
  # PostgreSQL Database
  - name: pinkpath-db
    plan: starter     # $7/month - persistent, no expiration
    databaseName: pinkpath
    region: oregon    # Same region as backend for low latency

# ==============================================
# NOTES
# ==============================================
# Plan summary:
# - Web service: free tier (spins down after 15min idle, ~30s cold start)
# - PostgreSQL: starter tier ($7/month, persistent, no expiration)
#
# Web service free tier still has cold-start latency (~30s after
# 15 min idle) and a 750 hours/month cap. Upgrade web service to
# Starter ($7/month) when ready for real production traffic to
# remove cold starts.
# ==============================================
